name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov
      - name: Lint
        run: ruff check app tests
      - name: Tests
        env:
          APP_ENV: test
          JWT_SECRET_KEY: ci-jwt-secret-key-32-bytes-minimum
          APP_SECRET_KEY: ci-secret
          DATABASE_URL: sqlite:///./ci.db
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
          pytest -q tests/test_isolation.py tests/test_billing_critical.py tests/test_hardening.py --cov=app.services.billing --cov=app.services.credits --cov=app.deps --cov-fail-under=75
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and typecheck
        run: |
          npm ci || npm install
          npx tsc --noEmit
