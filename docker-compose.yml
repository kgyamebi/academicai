services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academiccheck
      POSTGRES_PASSWORD: academiccheck
      POSTGRES_DB: academiccheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academiccheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://academiccheck:academiccheck@postgres:5432/academiccheck
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.rq_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://academiccheck:academiccheck@postgres:5432/academiccheck
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
