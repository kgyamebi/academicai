<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Settings</title></head>
  <body>
    <a href="#main-content">Skip to main content</a>
    <main id="main-content" tabindex="-1">
      <h1>Settings</h1>
      <p id="privacy-note">Assignments are private to your account.</p>
      <button type="button" aria-describedby="privacy-note" aria-expanded="true" aria-controls="delete-dialog">Delete account</button>
      <div id="delete-dialog" role="alertdialog" aria-labelledby="delete-title" aria-describedby="delete-desc">
        <h2 id="delete-title">Delete this account?</h2>
        <p id="delete-desc">This permanently deletes your documents. Press Escape or Cancel to keep the account.</p>
        <button type="button">Cancel</button>
        <button type="button">Delete account</button>
      </div>
    </main>
  </body>
</html>
