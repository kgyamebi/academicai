# Isolated certification stack. Not a production HA cluster.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academiccheck
      POSTGRES_PASSWORD: academiccheck
      POSTGRES_DB: academiccheck
    ports:
      - "55432:5432"
    volumes:
      - cert_pg_data:/var/lib/postgresql/data
      - cert_pg_backups:/backups
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academiccheck"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - cert_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cert_pg_data:
  cert_pg_backups:
  cert_redis_data:
