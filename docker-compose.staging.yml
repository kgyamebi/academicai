# Staging mirrors production topology: Postgres, Redis (AOF), API, workers, web, REQUIRE_QUEUE.
# Local/staging credentials only — never reuse production secrets.
#
# Bring up:  docker compose -f docker-compose.staging.yml up -d --build
# Validate:  set STAGING_URL=http://127.0.0.1:8000
#            set STAGING_WEB_URL=http://127.0.0.1:3000
#            python ops/validate_public_launch.py
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: academiccheck
      POSTGRES_PASSWORD: academiccheck_staging
      POSTGRES_DB: academiccheck
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academiccheck"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.22.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      REQUIRE_QUEUE: "true"
      DATABASE_URL: postgresql+psycopg://academiccheck:academiccheck_staging@postgres:5432/academiccheck
      REDIS_URL: redis://redis:6379/0
      APP_SECRET_KEY: staging-app-secret-change-me-32b
      JWT_SECRET_KEY: staging-jwt-secret-change-me-32bytes!!
      FIELD_ENCRYPTION_KEY: staging-field-key-change-me-32b
      COOKIE_SECURE: "false"
      STORAGE_LOCAL_PATH: /data/storage
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: disabled
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: noreply@academiccheck.local
      EMAIL_SMTP_PROBE_ON_STARTUP: "true"
      EMAIL_ASYNC: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPS_PROBE_TOKEN: ${OPS_PROBE_TOKEN:-staging-probe-token}
      APP_WEB_URL: http://127.0.0.1:3000
      APP_API_URL: http://127.0.0.1:8000
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      ALERT_SINK_FILE: /data/storage/alerts.jsonl
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - staging_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 10s
      retries: 18
      start_period: 40s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.rq_worker
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      REQUIRE_QUEUE: "true"
      DATABASE_URL: postgresql+psycopg://academiccheck:academiccheck_staging@postgres:5432/academiccheck
      REDIS_URL: redis://redis:6379/0
      APP_SECRET_KEY: staging-app-secret-change-me-32b
      JWT_SECRET_KEY: staging-jwt-secret-change-me-32bytes!!
      FIELD_ENCRYPTION_KEY: staging-field-key-change-me-32b
      STORAGE_LOCAL_PATH: /data/storage
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: disabled
      EMAIL_FROM: noreply@academiccheck.local
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - staging_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  staging_pg:
  staging_redis:
  staging_storage:
