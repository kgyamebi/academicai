global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: academiccheck-api
    metrics_path: /api/metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          env: local
