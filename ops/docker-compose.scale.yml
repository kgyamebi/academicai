# Local scale stack: primary Postgres, streaming replica, PgBouncer, Redis, MinIO, nginx LB + cache.
# Not a multi-region cloud. Ports chosen to avoid colliding with docker-compose.cert.yml (55432/56379).
name: academiccheck-scale

services:
  pg-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academiccheck
      POSTGRES_PASSWORD: academiccheck
      POSTGRES_DB: academiccheck
    ports:
      - "56432:5432"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=16
      - -c
      - max_replication_slots=8
      - -c
      - wal_keep_size=1024MB
      - -c
      - hot_standby=on
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - synchronous_commit=off
    volumes:
      - scale_pg_data:/var/lib/postgresql/data
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-repl.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academiccheck"]
      interval: 3s
      timeout: 5s
      retries: 30

  pg-replica:
    image: postgres:16-alpine
    user: postgres
    environment:
      PGPASSWORD: academiccheck
    depends_on:
      pg-primary:
        condition: service_healthy
    ports:
      - "56433:5432"
    volumes:
      - scale_pg_replica:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academiccheck"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: pg-primary
      DB_PORT: "5432"
      DB_USER: academiccheck
      DB_PASSWORD: academiccheck
      DB_NAME: academiccheck
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      AUTH_TYPE: plain
      LISTEN_PORT: "5432"
    ports:
      - "56434:5432"
    depends_on:
      pg-primary:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "56380:6379"
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: academiccheck
      MINIO_ROOT_PASSWORD: academiccheck
    ports:
      - "127.0.0.1:59010:9000"
      - "127.0.0.1:59011:9001"
    volumes:
      - scale_minio_data:/data

  nginx-lb:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx-cdn:
    image: nginx:1.27-alpine
    ports:
      - "18081:80"
    volumes:
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  scale_pg_data:
  scale_pg_replica:
  scale_minio_data:
