upstream academiccheck_api {
    least_conn;
    server host.docker.internal:18001;
    server host.docker.internal:18002;
    server host.docker.internal:18003;
    server host.docker.internal:18004;
    server host.docker.internal:18005;
    server host.docker.internal:18006;
    server host.docker.internal:18007;
    server host.docker.internal:18008;
    server host.docker.internal:18009;
    server host.docker.internal:18010;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_pass http://academiccheck_api;
    }
}
