# Local MinIO emulator for offsite backup drills. Not a production object store.
name: academiccheck-minio
services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: academiccheck-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: academiccheck
      MINIO_ROOT_PASSWORD: academiccheck
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - cert_minio_data:/data
    healthcheck:
      disable: true

volumes:
  cert_minio_data:
